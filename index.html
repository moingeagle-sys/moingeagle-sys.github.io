  .term-bar i:nth-child(2){background:#ffbd2e}
  .term-bar i:nth-child(3){background:#27c93f}
  .term-bar span{margin-left:10px;color:var(--muted);font-size:12px}
  .term-body{padding:20px 22px 24px}
  .line{color:var(--muted);font-size:13.5px;margin:16px 0 6px}
  .line:first-child{margin-top:0}
  .line .p{color:var(--accent);margin-right:8px}
  .cursor{display:inline-block;width:9px;height:16px;background:var(--accent);vertical-align:-3px;
    margin-left:4px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .term-body > *{opacity:0;animation:rise .45s ease forwards}
  .term-body > *:nth-child(1){animation-delay:.05s}
  .term-body > *:nth-child(2){animation-delay:.2s}
  .term-body > *:nth-child(3){animation-delay:.4s}
  .term-body > *:nth-child(4){animation-delay:.55s}
  .term-body > *:nth-child(5){animation-delay:.75s}
  .term-body > *:nth-child(6){animation-delay:.9s}
  .term-body > *:nth-child(7){animation-delay:1.1s}
  .term-body > *:nth-child(8){animation-delay:1.25s}
  @media(prefers-reduced-motion:reduce){.term-body > *{animation:none;opacity:1}.cursor{animation:none}}
  h1{font-size:clamp(24px,5vw,40px);line-height:1.15;margin:0;color:var(--heading)}

    empty_project:"Project", empty_project_txt:"Add a project here: edit the <b>proyectos</b> list in CONFIG.",
    empty_post:"Article", empty_post_txt:"Coming soon. Add entries to the <b>blog</b> list in CONFIG.",
    empty_exp:"Add your experience in CONFIG.", add_title:"Add your job title"
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https?:|mailto:|tel:|#|[\w./-]+$)/i.test(u) ? esc(u) : "#";
const K = CONFIG.comun;

function render(lang){
  const T = CONFIG[lang], U = UI[lang];
  document.documentElement.lang = lang;
  try { localStorage.setItem("lang", lang); } catch(e){}
  
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = U[el.dataset.i18n]);
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));

  const partes = K.nombre.split(" ");
  const iniciales = partes.filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  $("brand").textContent = partes[0].toLowerCase() + "@portfolio:~$";
  $("rol").textContent = T.rol;
  $("nombre").textContent = K.nombre;
  $("frase").textContent = T.frase;
  $("avatar").innerHTML = K.foto ? `<img src="${safeUrl(K.foto)}" alt="${esc(K.nombre)}">` : esc(iniciales);
  document.title = `${partes.slice(0,3).join(" ")} | ${lang === "es" ? "Portafolio" : "Portfolio"}`;

  const cv = K.cvUrl[lang];
  $("heroBtns").innerHTML =
    `<a class="btn primary" href="#contacto">${U.btn_contact}</a>` +
    `<a class="btn ghost" href="#proyectos">${U.btn_projects}</a>` +
    (cv ? `<a class="btn ghost" href="${safeUrl(cv)}" download>${U.btn_cv}</a>` : "");

  $("sobre").innerHTML = T.sobreMi.filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")
    + (T.disponibilidad ? `<p class="meta">${esc(T.disponibilidad)}</p>` : "");

  $("skills").innerHTML = T.habilidades.map(g =>
    `<div class="card"><h3>${esc(g.grupo)}</h3><ul class="tags" style="margin:0">${g.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");

  const vacia = (t, x) => `<div class="card empty"><h3>${t}</h3><p>${x}</p></div>`;

  $("proyectosGrid").innerHTML = T.proyectos.length ? T.proyectos.map(p => `
    <article class="card">
      <h3>${esc(p.nombre)}</h3>
      <p>${esc(p.descripcion)}</p>
      ${p.tecnologias?.length ? `<ul class="tags">${p.tecnologias.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      <div class="row">
        ${p.demo ? `<a href="${safeUrl(p.demo)}" target="_blank" rel="noopener">${U.demo}</a>` : ""}
        ${p.codigo ? `<a href="${safeUrl(p.codigo)}" target="_blank" rel="noopener">${U.code}</a>` : ""}
      </div>
    </article>`).join("")
    : [1,2,3].map(n => vacia(`${U.empty_project} ${n}`, U.empty_project_txt)).join("");

  $("exp").innerHTML = T.experiencia.length ? T.experiencia.map(e => `
    <div class="item">
      <h3>${esc(e.cargo || U.add_title)} · ${esc(e.empresa)}</h3>
      <div class="meta">${esc(e.periodo)}</div>
      <ul>${e.logros.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    </div>`).join("") : vacia(U.h_exp, U.empty_exp);

  $("edu").innerHTML = T.formacion.map(f => `
    <div class="item">
      <h3>${esc(f.titulo)}</h3>
      <div class="meta">${esc(f.institucion)} · ${esc(f.periodo)}${f.estado ? " · " + esc(f.estado) : ""}</div>
    </div>`).join("");

  $("certs").innerHTML = T.certificaciones.map(c =>
    `<li><b>${esc(c.nombre)}</b><span>${esc(c.emisor)} · ${esc(c.fecha)}</span></li>`).join("");

  $("blogGrid").innerHTML = T.blog.length ? T.blog.map(b => `
    <article class="card">
      <h3>${b.url ? `<a href="${safeUrl(b.url)}" target="_blank" rel="noopener">${esc(b.titulo)}</a>` : esc(b.titulo)}</h3>
      <div class="meta">${esc(b.fecha)}</div>
      <p>${esc(b.resumen)}</p>
    </article>`).join("")
    : [1,2].map(n => vacia(`${U.empty_post} ${n}`, U.empty_post_txt)).join("");

  $("contactoTxt").textContent = T.contactoTexto;
  $("contactList").innerHTML = [
    T.ciudad && `📍 ${esc(T.ciudad)}`,
    K.email && `✉️ <a href="mailto:${esc(K.email)}">${esc(K.email)}</a>`,
    K.telefono && `📞 <a href="tel:${esc(K.telefono.replace(/\s/g,''))}">${esc(K.telefono)}</a>`
  ].filter(Boolean).map(x=>`<li>${x}</li>`).join("");
  $("contactBtns").innerHTML =
    (K.email ? `<a class="btn primary" href="mailto:${esc(K.email)}">${U.btn_mail}</a>` : "") +
    (K.linkedin ? `<a class="btn ghost" href="${safeUrl(K.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : "") +
    (K.github ? `<a class="btn ghost" href="${safeUrl(K.github)}" target="_blank" rel="noopener">GitHub</a>` : "");

  $("footer").textContent = `© ${new Date().getFullYear()} ${K.nombre}`;
}

function idiomaInicial(){
  let guardado = null;
  try { guardado = localStorage.getItem("lang"); } catch(e){}
  if (guardado === "es" || guardado === "en") return guardado;
  if (K.idiomaInicial === "es" || K.idiomaInicial === "en") return K.idiomaInicial;
  return (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
}

document.querySelectorAll(".langs button").forEach(b =>
  b.addEventListener("click", () => render(b.dataset.lang)));

$("themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
});

render(idiomaInicial());
</script>
</body>
</html>
